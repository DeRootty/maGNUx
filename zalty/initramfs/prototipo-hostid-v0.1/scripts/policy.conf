# maGNUx — Dernel boot policy
# prototipo v0.1
#
# Syntax:
#   allow = /path/to/binary
#   deny_unknown = true|false
#
# deny_unknown = true  → only listed binaries can run (strict mode)
# deny_unknown = false → unlisted binaries are allowed (permissive)
#
# Start with permissive=false for prototype testing.
# Switch to true once the whitelist is complete.

[runtime]
policy_version = 1
deny_unknown = false

# Core boot binaries
allow = /sbin/init
allow = /sbin/udevd
allow = /sbin/mdev

# maGNUx components
allow = /sbin/xgnuped-init
allow = /sbin/dernel-runtime
allow = /sbin/dernel-guest

# Standard tools needed during initramfs
allow = /bin/sh
allow = /bin/busybox
allow = /sbin/mount
allow = /sbin/pivot_root
allow = /sbin/switch_root

[guest]
# Capabilities granted to the guest environment
# (parsed by dernel-guest in later versions)
capabilities = BASIC_SESSION
restrictions = NO_RAW_SOCKET
